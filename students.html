<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECU Students</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <img src="ECU-Logo.png" alt="ECU Logo" />
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="students.html">Students</a>
    <a href="doctors.html">Doctors</a>
    <a href="courses.html">Courses</a>
    <button id="logoutBtn">Logout</button>
  </aside>

  <main class="dashboard-content">
    <div class="dash-header">
      <h1>Students Management</h1>
      <p>Add, view, update and delete students</p>
    </div>

    <section class="crud-box">
      <form id="studentForm" class="crud-form">
        <input type="hidden" id="studentId" />

        <input type="text" id="name" placeholder="Student Name" required />
        <input type="email" id="email" placeholder="Student Email" required />
        <input type="text" id="phone" placeholder="Phone" required />
        <input type="text" id="department" placeholder="Department" required />
        <input type="number" id="level" placeholder="Level" required />

        <button type="submit">Save Student</button>
      </form>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Level</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="js/dashboard.js"></script>
<script src="js/students.js"></script>
</body>
</html>
